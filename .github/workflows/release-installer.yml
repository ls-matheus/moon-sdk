name: Build and publish installers

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release, por exemplo v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'latest' }}

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Compilar install.exe
        shell: pwsh
        run: |
          $iscc = Get-ChildItem -Path 'C:\Program Files (x86)', 'C:\Program Files' -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe não foi encontrado.' }
          & $iscc.FullName installer\install.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path install.exe)) { throw 'O instalador não foi gerado.' }
      - name: Publicar install.exe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Moon SDK - versão atualizada" --notes "Instaladores gerados automaticamente." || true
          gh release upload "$RELEASE_TAG" install.exe --repo "$GITHUB_REPOSITORY" --clobber

  macos-installer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Criar aplicativo instalador macOS
        run: |
          rm -rf dmg-root install.dmg
          mkdir -p dmg-root
          osacompile -o "dmg-root/Moon SDK Installer.app" installer/MoonSDKInstaller.applescript
          hdiutil create -volname "Moon SDK" -srcfolder dmg-root -ov -format UDZO install.dmg
          test -f install.dmg
      - name: Publicar install.dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Moon SDK - versão atualizada" --notes "Instaladores gerados automaticamente." || true
          gh release upload "$RELEASE_TAG" install.dmg --repo "$GITHUB_REPOSITORY" --clobber
