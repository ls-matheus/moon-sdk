name: Build and publish installers

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release, por exemplo v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'latest' }}

concurrency:
  group: release-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  database-contracts:
    uses: ./.github/workflows/database-tests.yml
  windows-installer:
    needs: database-contracts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Compilar install.exe
        shell: pwsh
        run: |
          $iscc = Get-ChildItem -Path 'C:\Program Files (x86)', 'C:\Program Files' -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe não foi encontrado.' }
          & $iscc.FullName "/DMoonCommit=${{ github.sha }}" installer\install.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path install.exe)) { throw 'O instalador não foi gerado.' }
      - name: Publicar install.exe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Moon SDK - versão atualizada" --notes "Instaladores gerados automaticamente." || true
          gh release upload "$RELEASE_TAG" install.exe --repo "$GITHUB_REPOSITORY" --clobber

  macos-installer:
    needs: database-contracts
    runs-on: macos-latest
    env:
      RESOURCE_TAG: macos-resources-${{ github.run_id }}-${{ github.run_attempt }}
    concurrency:
      group: macos-installer-${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'latest' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Criar instalador macOS
        run: bash installer/build-macos.sh
      - name: Publicar recursos versionados no GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RESOURCE_TAG" macos-resources/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false \
            --title "Recursos macOS - $RESOURCE_TAG" \
            --notes "Recursos fixos usados pelo instalador macOS deste build. Não remover: instaladores já baixados dependem destes arquivos."
      - name: Testar instalação e reinstalação baixando do GitHub
        run: |
          sudo installer -pkg Moon-SDK-Installer.pkg -target /
          /usr/local/bin/moon --help
          sudo installer -pkg Moon-SDK-Installer.pkg -target /
          /usr/local/bin/moon --help
      - name: Mostrar log em caso de falha
        if: failure()
        run: sudo cat /var/log/moon-sdk-installer.log || true
      - name: Publicar instalador macOS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Moon SDK - versão atualizada" --notes "Instaladores gerados automaticamente." || true
          gh release upload "$RELEASE_TAG" "Moon-SDK-Installer.pkg" --repo "$GITHUB_REPOSITORY" --clobber
