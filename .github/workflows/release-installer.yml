name: Build and publish installers

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release, por exemplo v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'latest' }}

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Compilar install.exe
        shell: pwsh
        run: |
          $iscc = Get-ChildItem -Path 'C:\Program Files (x86)', 'C:\Program Files' -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe não foi encontrado após a instalação do Inno Setup.' }
          & $iscc.FullName installer\install.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path install.exe)) { throw 'O instalador não foi gerado.' }
      - name: Armazenar instalador Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: install.exe

  macos-installer:
    runs-on: macos-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Gerar install.dmg
        run: |
          chmod +x installer/install-moon.command
          rm -rf dmg-root install.dmg
          mkdir -p dmg-root
          cp installer/install-moon.command dmg-root/
          hdiutil create -volname "Moon SDK" -srcfolder dmg-root -ov -format UDZO install.dmg
          test -f install.dmg
      - name: Armazenar instalador macOS
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: install.dmg

  publish:
    runs-on: ubuntu-latest
    needs: [windows-installer, macos-installer]
    steps:
      - name: Baixar instalador Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts
      - name: Baixar instalador macOS
        uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: artifacts
      - name: Publicar na aba Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$RELEASE_TAG"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/install.exe artifacts/install.dmg --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "Moon SDK - versão atualizada" --notes "Instaladores gerados automaticamente a partir do commit $GITHUB_SHA."
          else
            gh release create "$tag" artifacts/install.exe artifacts/install.dmg --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Moon SDK - versão atualizada" --notes "Instaladores gerados automaticamente a partir do commit $GITHUB_SHA."
          fi
